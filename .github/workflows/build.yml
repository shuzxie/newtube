name: Build NewTube ARM64 Only

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK (ARM64 Only)
        run: |
          ./gradlew :smarttubetv:assembleStmobileRelease -Pfdroid \
          -Pandroid.injected.abiFilters=arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NewTube-ARM64-Release
          path: smarttubetv/build/outputs/renamed_apks/stmobileRelease/*.apk
